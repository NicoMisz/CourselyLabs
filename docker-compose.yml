services:
  postgres:
    image: postgres:16-alpine
    container_name: courselylabs-db
    environment:
      POSTGRES_DB: cursos_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "4321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d cursos_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: courselylabs-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
