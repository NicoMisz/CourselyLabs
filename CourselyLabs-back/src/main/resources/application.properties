spring.application.name=CourselyLabs

# Database configuration
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cursos_db}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:4321/cursos_db}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${SERVER_PORT:8080}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:9000}

# JWT
jwt.secret=${JWT_SECRET:courselyLabsSecretKeyForJwtTokenSigningMustBeAtLeast256BitsLong!!}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Flyway — runs BEFORE Hibernate validation
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.defer-datasource-initialization=true

# Mail (MailHog en dev, Gmail SMTP en prod)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.from=${MAIL_FROM:noreply@courselylabs.com}

# App
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Docker Compose
spring.docker.compose.file=../docker-compose.yml
