spring.application.name=CourselyLabs

# Database configuration
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cursos_db}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:4321/cursos_db}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${SERVER_PORT:8080}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:9000}

# JWT
jwt.secret=${JWT_SECRET:courselyLabsSecretKeyForJwtTokenSigningMustBeAtLeast256BitsLong!!}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Flyway — runs BEFORE Hibernate validation
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.defer-datasource-initialization=true

# Mail (MailHog en dev, Gmail SMTP en prod)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.from=${MAIL_FROM:noreply@courselylabs.com}

# App
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Encriptación at-rest de secretos almacenados en BD (echo_token, etc.)
# Para producción generar con: openssl rand -hex 32
app.encryption.secret=${APP_ENCRYPTION_SECRET:dev-only-not-for-prod-change-me-1234567890abcdef}
app.encryption.salt=${APP_ENCRYPTION_SALT:deadbeefdeadbeef}

# Integración con echo lab (laboratorios virtuales sobre Proxmox)
app.echo.base-url=${ECHO_BASE_URL:https://echo.lab}
app.echo.timeout-seconds=${ECHO_TIMEOUT_SECONDS:8}
# Acepta certificados SSL self-signed/no confiables. Útil en dev contra
# echo.lab interno. NO USAR EN PRODUCCIÓN — inhabilita validación TLS.
app.echo.trust-all-certs=${ECHO_TRUST_ALL_CERTS:true}

# MinIO / S3 storage
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
storage.bucket=${STORAGE_BUCKET:courselylabs}
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:9000}
storage.presigned-url-expiry-minutes=${STORAGE_PRESIGN_EXPIRY:15}

# Upload limits (bytes)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.public-key=${STRIPE_PUBLIC_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.monthly-price-id=${STRIPE_MONTHLY_PRICE_ID:}
stripe.annual-price-id=${STRIPE_ANNUAL_PRICE_ID:}

# Docker Compose
spring.docker.compose.file=../docker-compose.yml
