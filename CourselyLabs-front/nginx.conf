# Nginx config para servir el SPA Vue y hacer proxy de /api al backend.
# Se monta como /etc/nginx/conf.d/default.conf en el contenedor.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subidas grandes (vídeos, PDFs) — sube si necesitas más.
    client_max_body_size 100M;

    # SPA fallback: cualquier ruta no resuelta cae a index.html (Vue Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend.
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Caché agresivo de los assets con hash (Vite los nombra con hash en build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
